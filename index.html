<script>
    const IS_PREVIEW = false; 
    const GAS_URL = "PASTE_URL_EXEC_KAMU_DISINI"; 

    // ... kode kamu yg lain biarkan ...

    // GANTI FUNGSI callGAS JADI INI
    function callGAS(payload) {
        return fetch(GAS_URL, {
            method: 'POST',
            mode: 'cors', // TAMBAH INI
            headers: {
                'Content-Type': 'application/json', // Ubah dari text/plain
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok: ' + response.status);
            }
            return response.json();
        });
    }
</script>
